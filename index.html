<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="blog-card.css">
  <title>Blog preview card</title>
</head>
<body>
  <main>
    <article class="blog-card-container">
      <header>
        <img src="assets/images/illustration-article.svg" alt="Abstract illustration of coding concepts with HTML and CSS elements" class="illustration">

        <div class="learn">
            <span class="learning-badge">Learning</span>
            <p>Published 21 Dec 2023</p>
        </div>
        
      </header>

      <div class="main-content">

        <h1>HTML & CSS foundations</h1>
        
        <p>These languages are the backbone of every website, defining structure, content, and presentation.</p>

      </div>
      

      <div class="profile">
        <img src="assets/images/image-avatar.webp" alt="Greg Hooper avatar">

        <p class="author-name">Greg Hooper</p>

      </div>
    </article>
  </main>
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Narges Ghasemi</a>.
  </footer>
</body>
</html>
